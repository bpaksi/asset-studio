name: release

# Manual only. Publishes @asset-studio/formats, player, cli and studio, in that
# order, via npm trusted publishing (GitHub OIDC, workflow release.yml, no
# environment). This job does not use a registry secret. It refuses to start if
# any of the four versions is already on npm. If a publish fails part-way, bump
# all four to the next patch and run again.
on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.4
      # setup-node writes registry-url into .npmrc as an _authToken line
      # that interpolates a placeholder auth env var. OIDC still works
      # because npm >= 11.5.1 swaps in the GitHub OIDC token at publish
      # time (v4 and v6 share this auth path).
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          cache: pnpm
      - name: Ensure npm >= 11.5.1 for trusted publishing
        run: npm install -g npm@11.5.1
      - name: Require all four versions to match and be unpublished
        run: |
          expected=""
          for pkg in packages/formats packages/player packages/cli packages/studio; do
            name="$(node -p "require('./${pkg}/package.json').name")"
            ver="$(node -p "require('./${pkg}/package.json').version")"
            if [[ ! "$ver" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(-[0-9A-Za-z.-]+)?$ ]]; then
              echo "::error::${pkg} version '${ver}' is not MAJOR.MINOR.PATCH with an optional prerelease."
              exit 1
            fi
            if [[ -z "$expected" ]]; then
              expected="$ver"
            elif [[ "$ver" != "$expected" ]]; then
              echo "::error::${pkg} version ${ver} does not match ${expected}"
              exit 1
            fi
            # Only a 404 means "not published". Any other npm error stops the run.
            if view="$(npm view "${name}@${ver}" version 2>&1)"; then
              echo "::error::${name}@${ver} is already on npm. Bump all four packages to a new version."
              exit 1
            elif ! grep -q "E404" <<<"$view"; then
              echo "::error::npm view ${name}@${ver} failed (not a 404): ${view}"
              exit 1
            fi
          done
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @asset-studio/studio exec playwright install --with-deps chromium
      - run: pnpm check
      - run: node scripts/smoke-pack.mjs
      - name: Publish formats, player, cli, studio with provenance
        run: |
          set -euo pipefail
          dest="${RUNNER_TEMP}/npm-tarballs"
          mkdir -p "$dest"
          # pnpm pack rewrites workspace:* to the real version (pnpm workspace
          # protocol). npm publish of the tarball is the OIDC path (npm >= 11.5.1);
          # pnpm 10 still shells publish out to npm and is not relied on here.
          # Pack all four before publishing any, so a pack failure publishes nothing.
          for pkg in packages/formats packages/player packages/cli packages/studio; do
            pkgdest="${dest}/$(basename "${pkg}")"
            mkdir -p "$pkgdest"
            pnpm --filter "./${pkg}" pack --pack-destination "$pkgdest"
          done
          for pkg in packages/formats packages/player packages/cli packages/studio; do
            npm publish "${dest}/$(basename "${pkg}")"/*.tgz --access public --provenance
          done
